name: Python-calcultor-CI

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Select which env use to run this workflow"
        required: true
        type: choice
        options:
          - test
          - deploy

jobs:
  installed-and-cache:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: install the python and Enable Caching
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip" # ⬅️ Explicitly activates dependency caching for fast runs

      - name: Check the python version
        run: python3 --version

      - name: Install the Dependencies
        run: pip install --upgrade pip && pip install -r requirements.txt

  test-and-lint:
    runs-on: ubuntu-latest
    needs: installed-and-cache
    steps:
      - name: Run Flake8 code analysis
        run: |
          flake8 app/calculator.py
          flake8 tests/test_calculator.py

      - name: Test the function
        env:
          PYTHONPATH: .
        run: pytest tests/test_calculator.py

      - name: after function test run the main code
        run: python3 app/calculator.py
