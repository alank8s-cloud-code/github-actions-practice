name: Run Real Tests in CI

on:
  workflow_dispatch:

jobs:
  flask-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: setup python version 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the dependency
        run: |
          python -m pip install --upgrade pip
          pip install -r flask-ci-demo/requirements.txt

      - name: Test the CI
        working-directory: flask-ci-demo
        run: |
          echo "=== Check the code =="
          pytest
