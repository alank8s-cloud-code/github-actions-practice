name: Github Secrets

on: workflow_dispatch

jobs:
  secrets:
    runs-on: Ubuntu-latest
    steps:
      - name: Checkout the Repo
        uses: actions/checkout@v6

      - name: Check if secret is set
        env:
          MY_SECRET_MESSAGE: ${{ secrets.MY_SECRET_MESSAGE }}
        run: |
          if [ -n "$MY_SECRET_MESSAGE" ]; then
            echo "The  secret is set: true"
          else
            echo "The secret is set: false"
          fi
      - name: Intentionally view the secret message
        run: |
          echo "My secret message: $MY_SECRET_MESSAGE"
