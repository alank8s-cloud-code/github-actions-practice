name: Test workflow

on:
  workflow_run:
    workflows: ["Run Tests"]
    types: [completed]

jobs:
  check-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check CI result
        run: |
          if [ "${{ github.event.workflow_run.conclusion}}" != "success" ]; then
            echo  "::warning::CI workflow failed. Deployment will not continue."
            exit 1
            
          else
            echo "✅ CI workflow succeeded."
            echo "Deployment can continue."
          fi

  deploy:
    needs: check-ci
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        run: |
          echo "🚀 Deploying application..."
