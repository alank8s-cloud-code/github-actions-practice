name: Reusable Docker Build & Push

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker image name"
        required: true
        type: string

      tag:
        description: "Docker image tag"
        required: true
        type: string

    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_TOKEN:
        required: true
    outputs:
      image_url:
        description: "full Docker image path"
        value: ${{ jobs.build-image.outputs.image_url }}
jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image_url: ${{steps.image.outputs.image_url}}

    steps:
      - name: Checkout the Repo
        uses: actions/checkout@v6

      - name: Setup Docker Build
        uses: docker/setup-buildx-action@v4

      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build the image and push to registry
        uses: docker/build-push-action@v7
        with:
          context: ./flask-app-ecs
          file: ./flask-app-ecs/Dockerfile.multistage
          push: true
          tags: |
            ${{ inputs.image_name }:${{ inputs.tag }}

      - name: Set Image URL
        id: image
        run: |
          echo "image_url=${{ inputs.image_name }}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
