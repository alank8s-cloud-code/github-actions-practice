name: Reusable Docker Build & Push

on:
  workflow_call:
    inputs:
      image_name:
        description: "Docker image name"
        required: true
        type: string

    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_TOKEN:
        required: true

    outputs:
      image_url:
        description: "Full Docker image path"
        value: ${{ jobs.build_image.outputs.image_url }}

jobs:
  build_image:
    runs-on: ubuntu-latest

    outputs:
      image_url: ${{ steps.image.outputs.image_url }}

    steps:
      - name: Checkout the Repo
        uses: actions/checkout@v6

      - name: Get Short Git SHA
        id: sha
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: ./flask-app-ecs
          file: ./flask-app-ecs/Dockerfile.multistage
          push: true
          tags: |
            ${{ inputs.image_name }}:latest
            ${{ inputs.image_name }}:sha-${{ steps.sha.outputs.short_sha }}

      - name: Set Image URL
        id: image
        run: |
          IMAGE_URL="${{ inputs.image_name }}:sha-${{ steps.sha.outputs.short_sha }}" 

          echo "IMAGE_URL=$IMAGE_URL"

          echo "image_url=$IMAGE_URL" >> "$GITHUB_OUTPUT"
