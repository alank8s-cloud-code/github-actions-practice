name: Build & Test

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version to use"
        required: false
        type: string
        default: "3.12"

      run-tests:
        description: "Whether to run tests"
        required: false
        type: boolean
        default: true

    outputs:
      test_result:
        description: "Result of the tests"
        value: ${{ jobs.build-test.outputs.test_result }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    outputs:
      test_result: ${{ steps.test.outputs.test_result }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup python version
        uses: actions/setup-python@v6
        with:
          python-version: ${{ inputs.python_version}}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install the dependency
        run: |
          python -m pip install -r flask-app-ecs/requirements.txt
          echo "Dependency install successfully"

      - name: Run Tests
        id: test
        if: ${{ inputs.run_tests }}
        run: |
          python -m pytest
          echo "test_result=passed" >> "$GITHUB_OUTPUT"

      - name: Tests skipped
        if: ${{ !inputs.run_tests }}
        run: |
          echo "Tests were skipped"
          echo "test_result=passed" >> "$GITHUB_OUTPUT"
