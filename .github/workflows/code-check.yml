name: Code Linting

on: workflow_dispatch

jobs:
  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Repo
        uses: actions/checkout@v6

      - name: python setup with 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 && python -m  pip install bandit
          python -m  pip install pip-audit

      - name: Lint Code
        run: flake8 flask-app-ecs/

      - name: Check code security
        run: bandit -r flask-app-ecs

      - name: Check the dependencies
        run: pip-audit -r flask-app-ecs/requirements.txt
