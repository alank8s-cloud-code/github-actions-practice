name: multiple-jobs workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "select the where you run"
        required: true
        type: choice
        options:
          - staging
          - prod

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Building the app"

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - run: echo "Running tests"

  deploy:
    runs-on: self-hosted
    needs: test
    steps:
      - run: echo "Deploying"
