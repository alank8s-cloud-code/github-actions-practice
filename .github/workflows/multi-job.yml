name: multiple-jobs workflow

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "select the where you run"
        required: true
        type: choice
        options:
          - staging
          - prod

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

  test:
    runs-on: self-hosted
    needs: build
    steps:
      - name: software testing
        run: echo "Running tests"

  deploy:
    runs-on: self-hosted
    needs: test
    steps:
      - name: Deploy the application to production
        run: echo "deploying"
