name: Environment variables Practice

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "select to run this workflow"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

env:
  APP_NAME: myapp

jobs:
  variable-testing:
    runs-on: self-hosted
    env:
      ENVIRONMENT: staging

    steps:
      - name: print all variables
        env:
          VERSION: 1.0.0
        run: |
          echo "APP_NAME: $APP_NAME"
          echo "ENVIRONMENT: $ENVIRONMENT"
          echo "VERSION: $VERSION"
