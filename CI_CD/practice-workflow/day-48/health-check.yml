name: Scheduled Health Check

on:
  schedule:
    - cron: "0 */12 * * *"

  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Pull Latest Docker Image
        run: |
          docker pull alank8scloud/flask-app:latest

      - name: Run Container
        run: |
          docker run -d --name flask-health-check -p 8080:80 alank8scloud/flask-app:latest

      - name: Wait for Application
        run: |
          sleep 5

      - name: Check Health Endpoint
        id: health
        run: |
          if curl --fail http://localhost:8080/health; then
            echo "Health check PASSED"
            echo "status=PASSED" >> "$GITHUB_OUTPUT"
          else
            echo "Health check FAILED"
            echo "status=FAILED" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Create Health Check Summary
        if: always()
        run: |
          echo "## Health Check Report" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: alank8scloud/flask-app:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "- Status: ${{ steps.health.outputs.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Time: $(date)" >> "$GITHUB_STEP_SUMMARY"

      - name: Stop and Remove Container
        if: always()
        run: |
          docker stop flask-health-check || true
          docker rm flask-health-check || true
