name: Secrets on

on:
  workflow_dispatch:

jobs:
  Secret:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: verify the Secret is set or not
        run: |
          if [ -n "${{ Secrets.MY_SECRET_MESSAGE }}" ]; then
            echo "The secret is set: true"
          else
            echo "The secret is set: false"
          fi

      - name: Access the secret value
        run: |
          echo "Secret value is: ${{ Secrets.MY_SECRET_MESSAGE }}"
