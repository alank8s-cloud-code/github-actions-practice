name: Smart Push Triggers

on:
  push:
    branches:
      - main
      - "release/*"

    paths:
      - "src/**"
      - "app/**"

jobs:
  path-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: show changed area
        run: |
          echo "workflow triggered because src/ or app/ changed"
          echo "Branch: ${{ github.ref_name }}"

      - name: Run build
        run: |
          echo "Running application build"
